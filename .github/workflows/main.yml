name: Telegram Join Manager V4

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-join-manager-v4
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight source and dependency check
        run: |
          python -m py_compile bot.py bootstrap.py
          python -c "from opentele2.api import API; from opentele2.tl import TelegramClient; print(API.TelegramDesktop.api_id)"

      - name: Configure git identity
        run: |
          git config user.name "join-manager-bot"
          git config user.email "join-manager-bot@users.noreply.github.com"

      - name: Run Telegram Join Manager
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          APPROVAL_CONCURRENCY: "15"
          AUTO_SCAN_SECONDS: "20"
          AUTO_APPROVE_BATCH: "100"
          RUN_SECONDS: "20000"
          PERSIST_TO_GIT: "true"
        run: python bot.py
